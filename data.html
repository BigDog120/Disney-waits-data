<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wait Magic — Data Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      background: #0d0d0d; color: #e0e0e0;
      padding: 24px 16px;
    }
    h1 { font-size: 1.3rem; color: #FFD700; margin-bottom: 4px; }
    .tagline { font-size: 0.78rem; color: #666; margin-bottom: 28px; }
    .back { font-size: 0.8rem; color: #FFD700; text-decoration: none; margin-left: 12px; }
    .back:hover { text-decoration: underline; }

    /* ── Day cards ── */
    .day-card {
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 14px; padding: 18px; margin-bottom: 24px;
    }
    .day-header {
      display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .day-title { font-size: 1rem; font-weight: 700; }
    .day-title.today  { color: #FFD700; }
    .day-title.yesterday { color: #30d158; }
    .meta { font-size: 0.72rem; color: #666; }
    .pill {
      font-size: 0.65rem; font-weight: 700; border-radius: 20px;
      padding: 2px 10px; letter-spacing: 0.4px;
    }
    .pill.live  { background: rgba(255,215,0,0.15);  color: #FFD700; }
    .pill.done  { background: rgba(48,209,88,0.15);  color: #30d158; }
    .pill.error { background: rgba(255,69,58,0.15);  color: #ff453a; }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat-val { font-size: 1.3rem; font-weight: 700; color: #FFD700; }
    .stat-lbl { font-size: 0.62rem; color: #666; margin-top: 2px; }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .filter-btn {
      background: #222; border: 1px solid #333; border-radius: 8px;
      padding: 4px 12px; font-size: 0.72rem; cursor: pointer; color: #aaa;
      transition: all 0.15s;
    }
    .filter-btn.active { background: #2a2a1a; border-color: #FFD700; color: #FFD700; }

    /* ── Table ── */
    .tbl-wrap { overflow-x: auto; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    thead tr { background: #111; }
    th {
      text-align: left; padding: 8px 10px;
      color: #666; font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.6px; text-transform: uppercase;
      white-space: nowrap;
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: #FFD700; }
    th .sort-arrow { margin-left: 4px; opacity: 0.4; }
    th.sorted .sort-arrow { opacity: 1; color: #FFD700; }
    tbody tr { border-top: 1px solid #1e1e1e; transition: background 0.1s; }
    tbody tr:hover { background: #1e1e1e; }
    td { padding: 8px 10px; white-space: nowrap; }
    .park-emoji { font-size: 1rem; margin-right: 4px; }
    .ride-name { font-weight: 600; white-space: normal; }
    .park-name { font-size: 0.68rem; color: #666; }
    .avg  { font-weight: 700; }
    .low-color  { color: #30d158; }
    .mid-color  { color: #FFD700; }
    .high-color { color: #ff453a; }
    .badge {
      font-size: 0.6rem; font-weight: 700; border-radius: 6px;
      padding: 2px 6px; white-space: nowrap;
    }
    .badge.low  { background: rgba(48,209,88,0.15);  color: #30d158; }
    .badge.mid  { background: rgba(255,215,0,0.12);  color: #FFD700; }
    .badge.high { background: rgba(255,69,58,0.15);  color: #ff453a; }
    .samples { color: #555; font-size: 0.7rem; }

    /* ── Empty / loading ── */
    .status { text-align: center; padding: 32px; color: #444; font-size: 0.85rem; }
    .raw-link { font-size: 0.7rem; color: #555; }
    .raw-link a { color: #FFD700; }
  </style>
</head>
<body>

<h1>✨ Wait Magic <span style="font-weight:400;color:#666;">— Data Dashboard</span>
  <a class="back" href="./">← App</a>
</h1>
<div class="tagline">Live view of the JSON data files collected by GitHub Actions</div>

<div id="root"></div>

<script>
const BASE = './data/';

function waitBand(avg) {
  if (avg < 20) return 'low';
  if (avg < 45) return 'mid';
  return 'high';
}
function waitLabel(avg) {
  if (avg < 20) return 'Short';
  if (avg < 45) return 'Moderate';
  return 'Long';
}
function waitColorClass(avg) {
  if (avg < 20) return 'low-color';
  if (avg < 45) return 'mid-color';
  return 'high-color';
}
function fmtTime(iso) {
  try {
    return new Date(iso).toLocaleString('en-US', {
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
    });
  } catch { return iso; }
}
function fmtDate(iso) {
  try {
    return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', {
      weekday: 'long', month: 'long', day: 'numeric'
    });
  } catch { return iso; }
}

async function fetchJSON(url) {
  const r = await fetch(url + '?t=' + Date.now());
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function parseRides(json) {
  if (!json || !json.rides) return [];
  return Object.values(json.rides).map(r => {
    const wts = r.wait_times || [];
    const avg  = wts.length ? Math.round(wts.reduce((a,b)=>a+b,0) / wts.length) : 0;
    return {
      id:      r.id,
      name:    r.name,
      park:    r.park_name,
      emoji:   r.park_emoji,
      avg, peak: Math.max(...wts, 0), low: Math.min(...wts, 0),
      samples: wts.length,
    };
  });
}

// ── Card builder ─────────────────────────────────────────────────────────────
function buildCard(containerId, label, cssClass, pill, json, error) {
  const wrap = document.getElementById(containerId);
  if (error || !json) {
    wrap.innerHTML = `
      <div class="day-card">
        <div class="day-header">
          <span class="day-title ${cssClass}">${label}</span>
          <span class="pill error">Not available</span>
        </div>
        <div class="status">${error || 'No data found.'}</div>
      </div>`;
    return;
  }

  const rides = parseRides(json);
  rides.sort((a,b) => b.avg - a.avg);

  const totalSamples = json.sample_count || (rides.length ? Math.max(...rides.map(r=>r.samples)) : 0);
  const parks = [...new Set(rides.map(r => r.park))];

  // State for filtering + sorting
  let filterPark = 'All';
  let sortCol    = 'avg';
  let sortDir    = -1;  // -1 = desc, 1 = asc

  function filtered() {
    let rows = filterPark === 'All' ? rides : rides.filter(r => r.park === filterPark);
    rows = [...rows].sort((a,b) => sortDir * (b[sortCol] - a[sortCol]));
    return rows;
  }

  function thArrow(col) {
    if (sortCol !== col) return '<span class="sort-arrow">↕</span>';
    return `<span class="sort-arrow">${sortDir === -1 ? '↓' : '↑'}</span>`;
  }

  function render() {
    const rows = filtered();
    wrap.innerHTML = `
      <div class="day-card">
        <div class="day-header">
          <span class="day-title ${cssClass}">${label}</span>
          <span class="pill ${pill.cls}">${pill.text}</span>
          <span class="meta">Last updated: ${fmtTime(json.last_updated)}</span>
        </div>

        <div class="stats-bar">
          <div class="stat"><div class="stat-val">${rides.length}</div><div class="stat-lbl">Rides tracked</div></div>
          <div class="stat"><div class="stat-val">${totalSamples}</div><div class="stat-lbl">Max samples</div></div>
          <div class="stat"><div class="stat-val">${parks.length}</div><div class="stat-lbl">Parks</div></div>
          <div class="stat"><div class="stat-val">${rides.length ? Math.round(rides.reduce((s,r)=>s+r.avg,0)/rides.length) : '—'}</div><div class="stat-lbl">Overall avg (min)</div></div>
        </div>

        <div class="filter-bar">
          ${['All', ...parks].map(p =>
            `<button class="filter-btn${filterPark===p?' active':''}" data-park="${p}">${p}</button>`
          ).join('')}
        </div>

        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>Ride</th>
                <th class="sortable${sortCol==='avg'?' sorted':''}" data-col="avg">Avg ${thArrow('avg')}</th>
                <th class="sortable${sortCol==='peak'?' sorted':''}" data-col="peak">Peak ${thArrow('peak')}</th>
                <th class="sortable${sortCol==='low'?' sorted':''}" data-col="low">Low ${thArrow('low')}</th>
                <th class="sortable${sortCol==='samples'?' sorted':''}" data-col="samples">Samples ${thArrow('samples')}</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td>
                    <span class="park-emoji">${r.emoji}</span>
                    <span class="ride-name">${r.name}</span><br>
                    <span class="park-name">${r.park}</span>
                  </td>
                  <td class="avg ${waitColorClass(r.avg)}">${r.avg} min</td>
                  <td>${r.peak} min</td>
                  <td>${r.low} min</td>
                  <td class="samples">${r.samples}</td>
                  <td><span class="badge ${waitBand(r.avg)}">${waitLabel(r.avg)}</span></td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>

        <div class="raw-link" style="margin-top:12px;">
          Raw JSON: <a href="${BASE}${label === "Today" ? 'today' : 'yesterday'}.json" target="_blank">${label === "Today" ? 'today' : 'yesterday'}.json</a>
        </div>
      </div>`;

    // Filter buttons
    wrap.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        filterPark = btn.dataset.park;
        render();
      });
    });

    // Sort headers
    wrap.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (sortCol === col) sortDir *= -1;
        else { sortCol = col; sortDir = -1; }
        render();
      });
    });
  }

  render();
}

// ── Boot ──────────────────────────────────────────────────────────────────────
document.getElementById('root').innerHTML = `
  <div id="card-today"></div>
  <div id="card-yesterday"></div>`;

(async () => {
  const [tdRes, ydRes] = await Promise.allSettled([
    fetchJSON(BASE + 'today.json'),
    fetchJSON(BASE + 'yesterday.json'),
  ]);

  buildCard(
    'card-today', 'Today', 'today', { cls: 'live', text: '● Live' },
    tdRes.status === 'fulfilled' ? tdRes.value : null,
    tdRes.status === 'rejected'  ? 'today.json not found — collector may not have run yet.' : null
  );

  buildCard(
    'card-yesterday', 'Yesterday', 'yesterday', { cls: 'done', text: '✓ Complete' },
    ydRes.status === 'fulfilled' ? ydRes.value : null,
    ydRes.status === 'rejected'  ? 'yesterday.json not found — will appear after the first full day.' : null
  );
})();
</script>
</body>
</html>
